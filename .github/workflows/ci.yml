name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore LoadBalancing.slnx
      - name: Build
        run: dotnet build LoadBalancing.slnx -c Release --no-restore
      - name: Test
        run: dotnet test LoadBalancing.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: TestResults

  web:
    name: Web (Angular 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false

  manifests:
    name: Kubernetes manifests + Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render & validate kustomize overlays
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for o in local azure; do
            kubectl kustomize k8s/overlays/$o > $o.yaml
            ./kubeconform -strict -summary $o.yaml
          done
      - name: Bicep build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  docker:
    name: Docker images
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/LoadBalancing.Api/Dockerfile
          push: false
          tags: loadbalancing-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: loadbalancing-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
