# Path 1 — Azure Load Balancer (Layer 4).
# AKS provisions a public IP on the cluster's Standard Load Balancer. Traffic flow:
#   client -> Azure LB (picks a node by 5-tuple hash) -> kube-proxy -> web pod -> api Service -> api pod
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
    # Uncomment to get a stable DNS name: <label>.<region>.cloudapp.azure.com
    # service.beta.kubernetes.io/azure-dns-label-name: lb-lab-<unique>
spec:
  type: LoadBalancer
  # Cluster (default): any node accepts traffic and forwards to a pod, possibly on another node (extra hop, SNAT).
  # Local: only nodes running a web pod pass the Azure health probe; preserves client IP. Try both!
  externalTrafficPolicy: Cluster
